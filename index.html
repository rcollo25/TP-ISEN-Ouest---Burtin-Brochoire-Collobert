<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISEN Ouest</title>
  <style>
    /* ----- HEADER ----- */
    header {
      background-color: #c8102e;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }
    .images-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

   .images-container img {
     width: 200px;
     height: auto;
     border-radius: 10px;
     transition: transform 0.3s;
    }

   .images-container img:hover {
     transform: scale(1.05);
    }


    /* ----- FOOTER ----- */
    .site-footer {
      background: #000;
      color: #fff;
      padding: 40px 20px 20px;
      font-family: Arial, sans-serif;
    }

    .footer-container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      gap: 40px;
      flex-wrap: wrap;
    }

    .footer-col-logo {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
    }

    .footer-logo {
      height: 100px;
      margin-bottom: 15px;
      margin-top: 30px;
    }

    .footer-links-section {
      flex: 3;
      display: flex;
      flex-direction: column;
    }

    .footer-cities {
      font-size: 40px;
      font-weight: 700;
      text-align: left;
      margin-bottom: 20px;
    }

    .footer-bottom {
      text-align: center;
      padding-top: 15px;
      background-color: white;
      color: black;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  
  <!-- HEADER_SIMPLE -->
  <header>
    <h1>Bienvenue à l'ISEN Ouest</h1>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="apprentissage.html">Apprentissage</a></li>
      </ul>
    </nav>
  </header>

  <main>
  <!-- PLUGGIN IMAGES -->
  <section class="formations-images">
    <h2>Nos formations ingénieurs</h2>
    <div class="images-container">
      <a href="https://isen-ouest.fr/" target="_blank">
        <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/21/vignette-dp-cybersecurite.png" alt="Cybersécurité">
      </a>
      <a href="https://isen-ouest.fr/" target="_blank">
        <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/21/vignette-dp-developpement-logiciel.png" alt="Développement logiciel">
      </a>
         <a href="https://isen-ouest.fr/" target="_blank">
          <img src="https://isen-ouest.fr/wp-content/uploads/2024/10/21/vignette-dp-intelligence-artificielle.png" alt="Intelligence artificielle">
        </a>
      </div>
    </section>
  </main>

  <!-- FOOTER_SIMPLE -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-col-logo">
        <img src="https://isen-ouest.fr/wp-content/uploads/2024/07/15/logo-isen-blanc.svg" 
             alt="ISEN Ouest" class="footer-logo">
      </div>
      <div class="footer-links-section">
        <p class="footer-cities">Texte à venir</p>
      </div>
    </div>
  </footer>
  <div class="footer-bottom">
    &copy; ISEN Ouest - 2025
  </div>

</body>
</html>
